services:
  browser:
    build:
      context: ../..
      dockerfile: workers/amazon/Dockerfile
    environment:
      AMAZON_BROWSER_SECRET: ${AMAZON_BROWSER_SECRET:?Set a dedicated random 32-character-or-longer server-only secret}
      PORT: "8080"
    ports: ["127.0.0.1:3115:8080"]
    init: true
    restart: on-failure:3
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    shm_size: 256m
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp-profile.json
    tmpfs:
      - /tmp:size=256m,mode=1777
