# Continuous integration for every pull request and direct push to main.
#
# The CI contract is exactly the local contract: install with a frozen
# lockfile, then run the single committed verification command. A failing
# verification sub-command exits non-zero and blocks this check, which is a
# required status check on main.
#
# Least privilege: read-only repository access, no persisted checkout
# credentials, no secrets exposed to pull-request code, and a hard job
# timeout. Superseded pull-request runs are canceled; main-branch runs are
# never canceled by a newer push.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Install and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned to verified full commit SHAs of the releases
      # named in the trailing comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm verify
