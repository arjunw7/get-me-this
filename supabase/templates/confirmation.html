<!--
  LOCAL TEST INFRASTRUCTURE ONLY (004c).

  The local Supabase stack's default magic-link template carries a link but
  no {{ .Token }} value, so the Mailpit-based local e2e suite could not read
  the six-digit code. This local template mirrors the staging project's
  branded combined message (docs/ops/resend-auth-delivery.md, 004b) in its
  004c form: the emailed link is built from the trusted destination plus
  {{ .TokenHash }} — built from the trusted RedirectTo (the 006c invitation sends target /auth/confirm/invite/[flowId]), never at
  Supabase's consuming verify endpoint — so a link click cannot consume the
  one-time token or create a session.

  Staging renders the same shape through the dashboard-hosted templates;
  the two staging templates are updated with the 004c link form as a
  staging-side change (see docs/delivery/issues/004c-email-request-and-otp-
  verification.md). This file affects local runs only.
-->
<html>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f7f4ef;
      font-family: -apple-system, &quot;Segoe UI&quot;, sans-serif;
      color: #241d16;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="
        max-width: 420px;
        margin: 0 auto;
        background: #fffdf8;
        border: 2px solid #241d16;
        border-radius: 20px;
      "
    >
      <tr>
        <td style="padding: 28px 28px 8px; text-align: center">
          <span
            style="
              font-size: 20px;
              font-weight: 800;
              letter-spacing: 0.02em;
              color: #241d16;
            "
            >GET ME THIS</span
          >
        </td>
      </tr>
      <tr>
        <td style="padding: 0 28px; text-align: center">
          <span
            style="
              display: inline-block;
              width: 56px;
              height: 8px;
              border-radius: 9999px;
              background: #ff6b57;
            "
          ></span>
        </td>
      </tr>
      <tr>
        <td style="padding: 20px 28px 4px; text-align: center">
          <p style="margin: 0; font-size: 16px; line-height: 1.5">
            Use this code to sign in:
          </p>
          <p
            style="
              margin: 12px 0;
              font-size: 34px;
              font-weight: 800;
              letter-spacing: 0.2em;
              color: #241d16;
            "
          >
            {{ .Token }}
          </p>
        </td>
      </tr>
      <tr>
        <td style="padding: 8px 28px 28px; text-align: center">
          <p
            style="
              margin: 0 0 16px;
              font-size: 14px;
              line-height: 1.5;
              color: #5c5348;
            "
          >
            You can also use your sign-in link. Both the code and the link
            expire in one hour.
          </p>
          <a
            href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email"
            style="
              display: inline-block;
              padding: 14px 28px;
              background: #ff6b57;
              color: #fffdf8;
              font-weight: 700;
              text-decoration: none;
              border-radius: 14px;
              border: 2px solid #241d16;
            "
          >
            Sign in to Get Me This
          </a>
        </td>
      </tr>
    </table>
  </body>
</html>
